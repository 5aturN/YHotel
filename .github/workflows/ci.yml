name: Сборка и проверка

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5
      - name: Настроить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Установить проект и средства разработки
        run: python -m pip install -e ".[dev]"
      - name: Проверить компиляцию модулей Python
        run: python -m compileall -q src
      - name: Проверить стиль кода
        run: ruff check src tests
      - name: Проверить безопасность исходного кода
        run: bandit -r src/yaotel -ll
      - name: Проверить зависимости на уязвимости
        run: pip-audit -r requirements-dev.txt
      - name: Запустить тесты unittest
        run: python -m unittest discover -s tests -v
      - name: Запустить тесты pytest
        run: python -m pytest -q
      - name: Собрать образ контейнера
        run: docker build --tag yaotel:${{ github.sha }} .
